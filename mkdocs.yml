site_name: Product Lead Mastery Path
site_description: A structured, module-wise product leadership training program from entry level to master level.
site_url: https://sigilipelli.github.io/product-lead-mastery-path/
repo_url: https://github.com/SIGILIPELLI/product-lead-mastery-path
repo_name: product-lead-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is a Product Lead?": level-1/01-what-is-a-product-lead.md
      - "02 · Leading a Product Team": level-1/02-leading-a-product-team.md
      - "03 · Setting Product Vision for a Team": level-1/03-setting-product-vision.md
      - "04 · Delegating Product Decisions": level-1/04-delegating-product-decisions.md
      - "05 · Cross-Team Alignment Basics": level-1/05-cross-team-alignment-basics.md
      - "06 · Mentoring PMs": level-1/06-mentoring-pms.md
      - "07 · Running Effective Product Rituals": level-1/07-running-product-rituals.md
      - "08 · Basic Org Design for Product Teams": level-1/08-basic-org-design.md
      - "09 · Hiring PMs Basics": level-1/09-hiring-pms-basics.md
      - "10 · Project — Product Team Charter & Rituals Plan": level-1/10-project-team-charter.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "Advanced Product Team Leadership": level-2/01-advanced-team-leadership.md
      - "Managing Multiple Product Squads": level-2/02-managing-multiple-squads.md
      - "Performance Management for PMs": level-2/03-performance-management.md
      - "Cross-Functional Leadership": level-2/04-cross-functional-leadership.md
      - "Product Strategy Cascading": level-2/05-strategy-cascading.md
      - "Advanced Hiring & Interviewing for Product": level-2/06-advanced-hiring-interviewing.md
      - "Coaching PMs on Discovery & Delivery": level-2/07-coaching-discovery-delivery.md
      - "Managing Up": level-2/08-managing-up.md
      - "Budget & Resourcing for Product Teams": level-2/09-budget-resourcing.md
      - "Project — Hiring & Team-Scaling Plan": level-2/10-project-hiring-scaling-plan.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-3/*.md
  level-4/*.md
